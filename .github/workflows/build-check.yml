name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      ci: ${{ steps.classify.outputs.ci }}
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      e2e: ${{ steps.classify.outputs.e2e }}
      frontend: ${{ steps.classify.outputs.frontend }}
      release_only: ${{ steps.classify.outputs.release_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi

      - name: Classify workflow coverage
        id: classify
        run: node scripts/workflowChangeClassification.cjs --input changed-files.txt

  entitlement-package-version:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'release/next')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Require an entitlement package version bump
        env:
          ENTITLEMENT_PACKAGE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
        run: yarn check:entitlement-package-version

      - name: Check entitlement lock synchronization
        run: yarn check:entitlement-locks

      - name: Entitlement package version policy tests
        run: yarn test:entitlement-package-version && yarn test:entitlement-locks

  version-validate:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/next') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'release/next')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate release version files
        run: yarn version:validate

      - name: Validate GitHub Pages deployment freeze
        run: yarn validate:deployment-freeze

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate GitHub Pages deployment freeze
        run: yarn validate:deployment-freeze

      - name: Lint application source
        run: yarn lint

      - name: TypeScript typecheck
        run: yarn tsc --noEmit

      - name: Validate GitHub Actions policy
        run: yarn validate:workflows

      - name: Unit tests
        run: yarn test:ci

      - name: Validate environment contract
        run: yarn env:contract:validate

      - name: Release version policy tests
        run: yarn test:release-version

      - name: Use Java for Firebase emulators
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules tests
        run: yarn test:rules

      - name: Storage rules tests
        run: yarn test:storage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: >-
      ${{
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        'release-validation' ||
        github.event_name == 'push' &&
        github.ref_name == 'main' &&
        'production' ||
        github.event_name == 'workflow_dispatch' &&
        (github.ref_name == 'main' || github.ref_name == 'release/next') &&
        'production' ||
        'development'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          CI: true
          REACT_APP_FIREBASE_API_KEY: ${{ vars[format('{0}_REACT_APP_FIREBASE_API_KEY', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars[format('{0}_REACT_APP_FIREBASE_AUTH_DOMAIN', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars[format('{0}_REACT_APP_FIREBASE_PROJECT_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars[format('{0}_REACT_APP_FIREBASE_STORAGE_BUCKET', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars[format('{0}_REACT_APP_FIREBASE_MESSAGING_SENDER_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars[format('{0}_REACT_APP_FIREBASE_APP_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars[format('{0}_REACT_APP_FIREBASE_MEASUREMENT_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_ENABLE_ANALYTICS: ${{ vars[format('{0}_REACT_APP_ENABLE_ANALYTICS', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ vars[format('{0}_REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_PUBLIC_KEY: ${{ vars[format('{0}_REACT_APP_STRIPE_PUBLIC_KEY', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars[format('{0}_REACT_APP_STRIPE_CUSTOMER_PORTAL_URL', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID: ${{ vars[format('{0}_REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID: ${{ vars[format('{0}_REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID: ${{ vars[format('{0}_REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID: ${{ vars[format('{0}_REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID: ${{ vars[format('{0}_REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID: ${{ vars[format('{0}_REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_WEATHER_API_KEY: ${{ vars[format('{0}_REACT_APP_WEATHER_API_KEY', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_PUBLIC_WEB_URL: ${{ vars[format('{0}_REACT_APP_PUBLIC_WEB_URL', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_PLAY_STORE_URL: ${{ vars[format('{0}_REACT_APP_PLAY_STORE_URL', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] }}
          REACT_APP_ANALYTICS_DEBUG: ${{ vars[format('{0}_REACT_APP_ANALYTICS_DEBUG', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
          REACT_APP_REQUIRE_EMAIL_VERIFICATION: ${{ vars[format('{0}_REACT_APP_REQUIRE_EMAIL_VERIFICATION', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || (github.event_name == 'pull_request' && github.base_ref == 'beta' && 'false' || 'true') }}
          REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL: ${{ vars[format('{0}_REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
          REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE: ${{ vars[format('{0}_REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
          REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION: ${{ vars[format('{0}_REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
          REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES: ${{ vars[format('{0}_REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
          REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES: ${{ vars[format('{0}_REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
          REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA: ${{ vars[format('{0}_REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA', github.event_name == 'pull_request' && github.base_ref == 'beta' && 'DEV' || 'PROD')] || 'false' }}
        run: |
          yarn sync:public-pricing
          yarn build

      - name: Check asset budgets
        run: yarn check:asset-budgets

  functions-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: functions/yarn.lock

      - name: Install functions dependencies
        run: yarn --cwd functions install --frozen-lockfile

      - name: Check entitlement lock synchronization
        run: yarn check:entitlement-locks

      - name: Validate Functions deploy package
        run: yarn validate:functions-package

      - name: Build functions
        run: yarn --cwd functions build

      - name: Validate Firebase Function export inventory
        run: yarn validate:functions-exports

      - name: Functions unit and integration tests
        run: yarn --cwd functions test:ci

      - name: Admin entitlement grant policy tests
        run: node scripts/testAdminEntitlementGrantPolicy.cjs

      - name: Email branding and lifecycle template tests
        run: node scripts/testEmailTemplates.cjs

      - name: Maintley Event lifecycle delivery tests
        run: node scripts/testMaintleyEventEngine.cjs

      - name: Use Java for Firebase emulators
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Entitlement grant issuance tests
        run: node ./functions/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore "node scripts/testEntitlementGrantIssuance.cjs"

      - name: Complimentary access code tests
        run: yarn test:access-codes

  beta-pr-gate:
    name: Beta PR Gate
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'beta'
    needs:
      - changes
      - entitlement-package-version
      - version-validate
      - unit-test
      - build
      - functions-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Beta validation results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ENTITLEMENT_RESULT: ${{ needs.entitlement-package-version.result }}
          VERSION_RESULT: ${{ needs.version-validate.result }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FUNCTIONS_RESULT: ${{ needs.functions-build.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$ENTITLEMENT_RESULT" = "success"
          test "$VERSION_RESULT" = "skipped"
          test "$UNIT_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$FUNCTIONS_RESULT" = "success"

  release-gate:
    name: Release Gate
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'release/next') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'release/next'))
    needs:
      - changes
      - entitlement-package-version
      - version-validate
      - unit-test
      - build
      - functions-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify release validation results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ENTITLEMENT_RESULT: ${{ needs.entitlement-package-version.result }}
          VERSION_RESULT: ${{ needs.version-validate.result }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FUNCTIONS_RESULT: ${{ needs.functions-build.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$ENTITLEMENT_RESULT" = "success"
          test "$VERSION_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$FUNCTIONS_RESULT" = "success"

